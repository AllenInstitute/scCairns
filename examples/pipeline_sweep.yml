pipeline_version: 1

reproducibility:
  seed: 0          # global RNG seed; set to null for an unseeded (non-reproducible) run

data:
  input_h5ad: data/combined_sns_adata.h5ad
  output_dir: rounds/sweep_01
  counts_layer: counts
  batch_key: data_origin
  categorical_covariate_keys: [tech]

integration:
  model_type: scvi
  max_epochs: 200
  early_stopping_patience: 20
  batch_size: 256
  num_workers: 4
  hvg:
    n_top_genes: 3000
    batch_key: tech
    flavor: seurat_v3
    min_batches: null
  # Each entry below overrides batch_key/categorical_covariate_keys on purpose, to
  # sweep the batch-correction strategy itself alongside model size. Omitting either
  # key from an entry falls through to the matching data.* value above instead
  # (present-but-empty, e.g. `categorical_covariate_keys: []`, does NOT fall through
  # — it's used as-is).
  sweep:
    - name: custom2_tech
      n_hidden: 16
      n_layers: 2
      n_latent: 32
      dispersion: gene-cell
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []
      hvg_batch_key: tech
      hvg_flavor: seurat
      hvg_nbatches: 3
    - name: medium_platform_cov
      n_hidden: 128
      n_layers: 2
      n_latent: 32
      dispersion: gene-cell
      gene_likelihood: nb
      batch_key: platform_origin
      categorical_covariate_keys: [data_origin]
      hvg_batch_key: platform_origin
      hvg_flavor: seurat
      hvg_nbatches: 3
  harmony:
    enabled: false           # runs once per round, compared against every swept scVI
    batch_key: null          # defaults to data.batch_key when null
    n_pcs: 30
    hvg_from: null            # null = use integration.hvg; or name a sweep entry
                             # above (e.g. medium_platform_cov) to borrow its HVGs

inspection:
  # This sweep trains several scVI architectures to compare; all_architectures
  # inspects each one (+ Harmony), writing a report per architecture to
  # output-dir/inspect_<name>/ so you can review them side by side and pick one.
  # Set false (or omit) to review a single variant instead.
  all_architectures: true

annotation:
  enabled: false

benchmark:
  enabled: true
  batch_key: auto
  label_key: null

decisions:
  ignore_failed_queries: false
