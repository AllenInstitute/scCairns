pipeline_version: 1

data:
  input_h5ad: /root/capsule/data/260603_cmg_round1/integrated.h5ad
  output_dir: /root/capsule/results/rounds/round_02
  counts_layer: counts
  batch_key: tech
  categorical_covariate_keys: []
  continuous_covariate_keys: []
  sample_key: null
  technology_key: tech
  species: mouse
  gene_symbol_case: preserve

qc:
  enabled: true
  min_genes: 500
  min_cells: 3
  mt_gene_patterns: ["mt-"]
  ribo_gene_patterns: ["rps", "rpl"]
  hb_gene_pattern: "^hb[^(p)]"
  skip_filter_after_round_1: true

integration:
  model_type: scvi
  n_hidden: 256
  n_layers: 3
  n_latent: 32
  num_workers: 15
  dispersion: gene-cell
  gene_likelihood: nb
  max_epochs: 300
  early_stopping_patience: 20
  batch_size: 256
  hvg:
    n_top_genes: 3000
    batch_key: tech
    flavor: seurat_v3
    min_batches: null
  sweep:
    - name: small_geneXcell_zinb
      n_hidden: 64
      n_layers: 1
      n_latent: 10
      dispersion: gene-cell
      gene_likelihood: zinb
      batch_key: tech
      categorical_covariate_keys: []
    
    - name: small_geneXbatch_zinb
      n_hidden: 64
      n_layers: 1
      n_latent: 10
      dispersion: gene-batch
      gene_likelihood: zinb
      batch_key: tech
      categorical_covariate_keys: []

    - name: small_gene_nb
      n_hidden: 64
      n_layers: 1
      n_latent: 10
      dispersion: gene
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []

    - name: small_geneXcell_nb
      n_hidden: 64
      n_layers: 1
      n_latent: 10
      dispersion: gene-cell
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []
   
    - name: medium_geneXcell_nb
      n_hidden: 80
      n_layers: 2
      n_latent: 24
      dispersion: gene-cell
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []
    
    - name: large_geneXcell_cell_nb
      n_hidden: 128
      n_layers: 2
      n_latent: 32
      dispersion: gene-cell
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []

annotation:
  enabled: false
  method: scanvi
  labels_key: null
  unlabeled_category: Unknown
  prediction_key: scanvi_label
  confidence_key: scanvi_confidence
  min_confidence: 0.5

embedding:
  n_neighbors: 30
  umap_min_dist: 0.4
  umap_spread: 3.0
  leiden_resolution: 0.3

inspection:
  cluster_key: auto
  latent_key: auto
  umap_key: auto
  markers_json: null
  marker_threshold: 0.0
  neuronal_cutoff: 0.5
  pca_color_gene: Snap25
  auto_flag:
    mt_threshold: 15.0
    min_genes_threshold: 400
    min_cells: 20
    single_batch_threshold: 0.90
    silhouette_threshold: -0.05

benchmark:
  enabled: true
  batch_key: auto
  label_key: null

decisions:
  ignore_failed_queries: false
