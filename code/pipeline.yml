pipeline_version: 1

reproducibility:
  seed: 0          # global RNG seed; set to null for an unseeded (non-reproducible) run

data:
  input_h5ad: /data/260603_CMG_untreated_unint/cmg_untreated_260603.h5ad
  output_dir: /root/capsule/results/rounds/round_01
  obs_filter: "condition not in ['LPS 1mg/kg', 'LPS']"
  counts_layer: counts
  batch_key: tech
  categorical_covariate_keys: []
  continuous_covariate_keys: []
  sample_key: animal_id
  technology_key: tech
  species: mouse
  gene_symbol_case: preserve

qc:
  enabled: true
  min_genes: 500
  min_cells: 1        # keep every observed gene; raise to be stricter
  mt_gene_patterns: ["mt-"]
  ribo_gene_patterns: ["rps", "rpl"]
  hb_gene_pattern: "^hb[^(p)]"
  skip_filter_after_round_1: true

integration:
  model_type: scvi
  n_hidden: 256
  n_layers: 3
  n_latent: 32
  num_workers: 15
  dispersion: gene-cell
  gene_likelihood: nb
  max_epochs: 300
  early_stopping_patience: 20
  batch_size: 256
  hvg:
    n_top_genes: 3000
    batch_key: tech
    flavor: seurat_v3
    min_batches: null
  sweep:
    - name: small_geneXcell_zinb
      n_hidden: 64
      n_layers: 1
      n_latent: 10
      dispersion: gene-cell
      gene_likelihood: zinb
      batch_key: tech
      categorical_covariate_keys: []
    
    - name: small_geneXbatch_zinb
      n_hidden: 64
      n_layers: 1
      n_latent: 10
      dispersion: gene-batch
      gene_likelihood: zinb
      batch_key: tech
      categorical_covariate_keys: []

    - name: small_gene_nb
      n_hidden: 64
      n_layers: 1
      n_latent: 10
      dispersion: gene
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []

    - name: small_geneXcell_nb
      n_hidden: 64
      n_layers: 1
      n_latent: 10
      dispersion: gene-cell
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []
   
    - name: medium_geneXcell_nb
      n_hidden: 80
      n_layers: 2
      n_latent: 24
      dispersion: gene-cell
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []
    
    - name: large_geneXcell_cell_nb
      n_hidden: 128
      n_layers: 2
      n_latent: 24
      dispersion: gene-cell
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []

    - name: Xlarge_geneXcell_cell_nb
      n_hidden: 128
      n_layers: 2
      n_latent: 32
      dispersion: gene-cell
      gene_likelihood: nb
      batch_key: tech
      categorical_covariate_keys: []
  harmony:
    enabled: true       # run Harmony alongside scVI (single-model or sweep)
    batch_key: null      # defaults to data.batch_key when null
    n_pcs: 30            # PCA dimensionality Harmony corrects (>= 2)
    hvg_from: null       # sweep mode: name a sweep entry to borrow its HVGs;


annotation:
  enabled: false
  method: scanvi
  labels_key: null
  unlabeled_category: Unknown
  prediction_key: scanvi_label
  confidence_key: scanvi_confidence
  min_confidence: 0.5

embedding:
  n_neighbors: 30
  umap_min_dist: 0.4
  umap_spread: 3.0
  leiden_resolution: 0.3

inspection:
  cluster_key: auto
  latent_key: auto
  umap_key: auto
  # Inspect every complete sweep architecture (+ Harmony), one report per
  # architecture in output-dir/inspect_<name>/. Same as --all-sweep-architectures.
  all_architectures: false
  markers_json: null
  marker_threshold: 0.0
  neuronal_cutoff: 0.5
  pca_color_gene: Snap25
  auto_flag:
    mt_threshold: 15.0
    min_genes_threshold: 400
    min_cells: 20
    single_batch_threshold: 0.90
    silhouette_threshold: -0.05
  # Marker-based per-cell contamination flagging (cluster-independent).
  # Writes contamination_zscore.csv and contamination_flagged_cells.csv per
  # report; reference the latter from decisions.yaml via remove_cells.cells_file.
  contamination:
    z_thresh: 2.0
    min_genes: 2
    layer: null          # null -> adata.X (log-normalized)
    # panels: null omits the key -> flag_contamination's built-in mouse SNS
    # panels (endothelial, hepatic). Override with your own lineages:
    # panels:
    #   endothelial: [Flt1, Kdr, Emcn, Cdh5, Pecam1]
    #   hepatic:     [Slco1a1, Slco1a4, G6pc, Mug1, Ugt2b1]

benchmark:
  enabled: true
  batch_key: auto
  label_key: null

decisions:
  ignore_failed_queries: false
